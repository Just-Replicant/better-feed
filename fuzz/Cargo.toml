[package]
name = "better-feed-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
better-feed = { path = "../feed-rs", features = ["sanitize"] }

# Not part of the main workspace; build with `cargo +nightly fuzz run <target>` from the repository root
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_untrusted"
path = "fuzz_targets/parse_untrusted.rs"
test = false
doc = false
bench = false

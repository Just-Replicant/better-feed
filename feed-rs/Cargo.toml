[package]
name = "better-feed"
version = "3.0.1"
edition = '2024'
authors = ["Mark Pritchard <mpritcha@gmail.com>"]
include = [
    "**/*.rs",
    "Cargo.toml",
    "LICENSE-MIT",
    "README.md",
    "fixture/*"
]
license = "MIT"
homepage = "https://github.com/Just-Replicant/better-feed"
repository = "https://github.com/Just-Replicant/better-feed.git"
description = "A feed parser that handles Atom, RSS 2.0, RSS 1.0, RSS 0.x and JSON Feed"
keywords = ["rss", "atom", "json", "jsonfeed", "parser"]
categories = ["parser-implementations"]
readme = "README.md"

[dependencies]
ammonia = { version = "4.2.0", optional = true }
chrono = { version = "0.4.45", features = ["serde"] }
mediatype = { version = "0.23.0", features = ["serde"] }
quick-xml = { version = "0.42.0", features = ["encoding"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
siphasher = "1.0.4"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4"] }

[features]
sanitize = ["dep:ammonia"]
